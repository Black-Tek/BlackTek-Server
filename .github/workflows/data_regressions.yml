name: Data regressions
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check scripts and data regressions
        run: python tests/data/run.py
